on:
  push:
    branches:
      - main
      - rel-1877
      - sta-1877
      - rel-2150
      - sta-2150
  workflow_dispatch:
  # on pr
  pull_request:
    branches:
      - main
      - rel-1877
      - sta-1877
      - rel-2150
      - sta-2150
  schedule:
    - cron: '0 0 * * *'
jobs:
  build:
    permissions:
      contents: write
    uses: gardenlinux/package-build/.github/workflows/build.yml@c6a92703b5b88b2c5086e51469fef5ad7755391c # main
    with:
      # publish not on PR
      publish_release: ${{ github.event_name != 'pull_request' }}
      release: false #${{ github.ref == 'refs/heads/main' }}
      arch: '["amd64"]'
